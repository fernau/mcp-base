name: Publish mcp-base image

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push mcp-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcp-base:26.04
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Trivy image scan
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/mcp-base:26.04
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
